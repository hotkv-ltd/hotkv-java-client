name: Publish

# Publishes the signed artifacts to Maven Central through the Central Portal.
#
#   * push of a tag v<version>: builds, tests and publishes (the tag must equal v + pom version)
#   * manual run: dry_run (default true) builds, tests and packages the release artifacts
#     without signing or uploading anything; set it to false on a tag to publish
#
# Repository secrets used when publishing:
#   CENTRAL_USERNAME, CENTRAL_PASSWORD  Central Portal user token
#   GPG_PRIVATE_KEY                     ASCII armored private key
#   GPG_PASSPHRASE                      its passphrase

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only, do not sign or publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Verify the tag equals the pom version
        run: |
          version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "pom version: ${version}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match pom version v${version}"
              exit 1
            fi
          elif [ "${PUBLISH}" = "true" ]; then
            echo "::error::publishing needs a tag ref; run the workflow from a v* tag"
            exit 1
          else
            echo "dry run on ${GITHUB_REF_NAME}: tag check skipped"
          fi

      - name: Build and run unit tests
        run: mvn -B verify

      - name: Build the release artifacts (unsigned)
        run: mvn -B -Prelease -Dgpg.skip -DskipTests package

      - name: List artifacts
        run: ls -l target/*.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hotkv-client-release
          path: target/*.jar

      - name: Import the GPG key
        if: env.PUBLISH == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "${GPG_PRIVATE_KEY}" || { echo "::error::secret GPG_PRIVATE_KEY is not set"; exit 1; }
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Sign and publish to Maven Central
        if: env.PUBLISH == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease -DskipTests -Dcentral.autoPublish=true deploy
